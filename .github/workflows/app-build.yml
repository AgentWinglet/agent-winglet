name: App build

# Cross-platform CI matrix for the desktop dashboard app: a real `wails
# build` per OS, not just `go build ./...` without Wails' desktop/production
# build tags — that succeeds trivially everywhere since the untagged build
# swaps in a stub with no native webview, so it wouldn't actually catch a
# broken build the way this matrix does. Kept separate from ci.yml (which
# stays fast: Go-only, ubuntu-only) since this job is slower and needs
# OS-specific system packages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"

      # libayatana-appindicator3-dev is for cmd/agent-winglet-tray (the
      # login-item tray helper, see its doc comment): getlantern/systray's
      # Linux backend is cgo against GTK + an AppIndicator binding, same as
      # the app's own gtk/webkit deps below but a separate library that
      # isn't pulled in by wails. Ayatana is the actively-maintained fork
      # current Ubuntu ships; older distros may need libappindicator3-dev
      # instead (see install.sh's own note on this for the local-install
      # path).
      # Cached (keyed on the package list) since GitHub's default Azure apt
      # mirror has intermittent slow/degraded periods that otherwise turn
      # this install into a multi-minute stall.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          version: 1.0

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build, install, and uninstall the app
        shell: bash
        # Runs install.sh/uninstall.sh's --app-only path instead of a bare
        # `wails build` — this is a real end-to-end smoke test of the actual
        # user-facing install mechanism (which wraps `make app` and, since
        # the tray helper's launch-at-login was added, `make tray` too, so
        # it's still "a real wails build per OS, not just go build ./..."
        # per the original point of this job) on all three OSes, which
        # matters because only macOS gets run by hand day to day;
        # Windows/Linux only get exercised here.
        #
        # This does exercise the tray binary actually launching (install.sh
        # starts it, or on macOS registers it via launchctl with
        # RunAtLoad=true), but only proves it doesn't crash outright — these
        # are headless runners with no real desktop session, so it can't
        # verify the icon is visible/clickable the way the manual pass in
        # the plan's Verification section does.
        run: |
          ./install.sh --app-only
          ./uninstall.sh --app-only
