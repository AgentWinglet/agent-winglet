name: App build

# Cross-platform CI matrix for the desktop dashboard app (agent-winglet-v1
# step 3 spec, §9): a real `wails build` per OS, not just `go build ./...`
# without Wails' desktop/production build tags — that succeeds trivially
# everywhere since the untagged build swaps in a stub with no native webview,
# so it wouldn't actually catch a broken build the way this matrix does.
# Kept separate from ci.yml (which stays fast: Go-only, ubuntu-only) since
# this job is slower and needs OS-specific system packages.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # See master spec §6's "GNOME systray landmine" note: not relevant here
      # since v1 ships no tray icon (see this app's spec §6's open risk,
      # resolved toward the Dock/taskbar-only fallback after the systray
      # spike found an AppDelegate symbol collision with Wails on macOS).
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build app
        working-directory: cmd/agent-winglet-app
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            export CGO_LDFLAGS="-framework UniformTypeIdentifiers"
          fi
          wails build
