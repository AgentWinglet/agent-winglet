name: App build

# Cross-platform CI matrix for the desktop dashboard app: a real `wails
# build` per OS, not just `go build ./...` without Wails' desktop/production
# build tags — that succeeds trivially everywhere since the untagged build
# swaps in a stub with no native webview, so it wouldn't actually catch a
# broken build the way this matrix does. Kept separate from ci.yml (which
# stays fast: Go-only, ubuntu-only) since this job is slower and needs
# OS-specific system packages.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build, install, and uninstall the app
        shell: bash
        # Runs install.sh/uninstall.sh's --app-only path instead of a bare
        # `wails build` — this is a real end-to-end smoke test of the actual
        # user-facing install mechanism (which wraps `make app`, so it's
        # still "a real wails build per OS, not just go build ./..." per the
        # original point of this job) on all three OSes, which matters
        # because only macOS gets run by hand day to day; Windows/Linux only
        # get exercised here.
        run: |
          ./install.sh --app-only
          ./uninstall.sh --app-only
