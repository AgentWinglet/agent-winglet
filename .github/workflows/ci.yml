name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets release.yml's `test` job reuse these checks as a release gate
  # instead of duplicating them.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"

      - name: Create frontend/dist placeholder
        # cmd/agent-winglet-app embeds frontend/dist (git-ignored build output)
        # via go:embed. This job stays Go-only/fast (real frontend build +
        # webview compile is covered by app-build.yml), so just give the
        # embed directive a file to satisfy the compiler.
        run: |
          mkdir -p cmd/agent-winglet-app/frontend/dist
          touch cmd/agent-winglet-app/frontend/dist/placeholder

      - name: Install Linux system dependencies
        # cmd/agent-winglet-tray imports getlantern/systray unconditionally
        # (no Wails build tags to stub it out like the app binary), so even
        # this Go-only/fast job needs systray's Linux cgo dep to compile it.
        run: |
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Installer smoke
        run: make installer-smoke
