name: Release

# Builds and publishes the public installers for a tagged release: macOS
# signed and notarized, Ubuntu unsigned (.deb packages aren't code-signed),
# Windows signed if WINDOWS_CERTIFICATE_BASE64 is configured and unsigned
# otherwise (see windows-package's "Decode signing certificate" step).
# Distinct from app-build.yml (PR/main smoke test: unsigned, host-arch only)
# and ci.yml (fast Go-only checks, reused here as the `test` gate): this is
# the slow, secrets-using path that only runs for an actual version tag (or
# a manual dry run via workflow_dispatch, which skips publishing — see the
# `publish` job's `if`).
#
# Required repository secrets:
#   macOS signing/notarization:
#     MACOS_CERTIFICATE_BASE64      Developer ID Application cert, as a
#                                    base64-encoded .p12
#     MACOS_CERTIFICATE_PASSWORD    that .p12's export password
#     MACOS_KEYCHAIN_PASSWORD       password for the temporary CI keychain
#                                    (any random string; only exists for
#                                    this job's lifetime)
#     MACOS_NOTARY_KEY_BASE64       App Store Connect API key, as a
#                                    base64-encoded .p8
#     MACOS_NOTARY_KEY_ID           that API key's Key ID
#     MACOS_NOTARY_ISSUER_ID        that API key's Issuer ID
#   Windows signing:
#     WINDOWS_CERTIFICATE_BASE64    Authenticode code-signing cert, as a
#                                    base64-encoded .pfx
#     WINDOWS_CERTIFICATE_PASSWORD  that .pfx's export password
#
# See scripts/package/macos.sh's header comment for how to obtain the macOS
# credentials in the first place (creating the Developer ID cert, generating
# the API key) — encode either binary secret with `base64 -i file -o -`
# (macOS) or `base64 -w0 file` (Linux) before pasting it into a GitHub
# Actions secret.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v) for a manual dry run — ignored on a real tag push, which always uses the tag"
        required: false
      platform:
        description: "Which platform(s) to build for a manual dry run — ignored on a real tag push, which always builds all three"
        required: false
        type: choice
        default: all
        options:
          - all
          - macos
          - windows
          - ubuntu

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            source scripts/package-lib.sh
            version="$(resolve_version)"
          fi
          if [[ ! "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: expected semver like 1.2.3, 1.2.3-beta.1, or 1.2.3+build.1." >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  macos-package:
    needs: [test, determine-version]
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install create-dmg
        run: brew install create-dmg

      # Standard GitHub Actions pattern for codesigning: import the
      # Developer ID cert into a throwaway keychain that only exists for
      # this job's lifetime, rather than touching the runner's real login
      # keychain. MACOS_SIGN_IDENTITY is derived from the imported cert (not
      # itself a secret) and exported for the build step below.
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="${RUNNER_TEMP}/certificate.p12"
          keychain_path="${RUNNER_TEMP}/build.keychain"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          # Setting it default alone isn't enough — codesign/find-identity
          # resolve against the keychain *search list*, which a fresh
          # keychain isn't automatically added to.
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          rm -f "$certificate_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | grep '"Developer ID Application:' | head -1 | sed -E 's/.*"(Developer ID Application:[^"]+)".*/\1/')"
          if [ -z "$identity" ]; then
            echo "No Developer ID Application signing identity found in temporary keychain." >&2
            exit 1
          fi
          echo "MACOS_SIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=${keychain_path}" >> "$GITHUB_ENV"

      - name: Write notarization API key
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
        run: |
          printf '%s' "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "${RUNNER_TEMP}/notary_key.p8"
          echo "MACOS_NOTARY_KEY_PATH=${RUNNER_TEMP}/notary_key.p8" >> "$GITHUB_ENV"

      - name: Build and package macOS
        env:
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: make package-macos VERSION="$VERSION"

      - name: Verify
        run: ./scripts/package/macos-verify.sh cmd/agent-winglet-app/build/bin/Winglet.app dist/macos/*.dmg

      - name: Clean up keychain and API key
        if: always()
        run: |
          security delete-keychain "${MACOS_KEYCHAIN_PATH:-${RUNNER_TEMP}/build.keychain}" || true
          rm -f "${RUNNER_TEMP}/certificate.p12"
          rm -f "${RUNNER_TEMP}/notary_key.p8"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-dmg
          path: dist/macos/*

  macos-artifact-validation:
    needs: [macos-package]
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-dmg
          path: dist/macos

      - name: Validate downloaded DMG
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(dist/macos/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected exactly one DMG artifact, found ${#dmgs[@]}." >&2
            printf 'Found: %s\n' "${dmgs[@]:-none}" >&2
            exit 1
          fi
          xcrun stapler validate "${dmgs[0]}"
          spctl --assess --type open --context context:primary-signature --verbose "${dmgs[0]}"

  windows-package:
    needs: [test, determine-version]
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    outputs:
      signed: ${{ steps.decode-cert.outputs.signed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      # choco installs NSIS onto the machine PATH via the registry, but the
      # runner process was already started and won't see that change — so
      # subsequent steps (a fresh child process each, inheriting the
      # runner's own stale env) can't find makensis unless its install dir
      # is added to $GITHUB_PATH explicitly here.
      - name: Install NSIS
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq $maxAttempts) {
              throw "choco install nsis failed after $maxAttempts attempts (exit code $LASTEXITCODE)"
            }
            Write-Host "choco install nsis failed (exit code $LASTEXITCODE), retrying in 15s (attempt $attempt/$maxAttempts)..."
            Start-Sleep -Seconds 15
          }
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$nsisPath\makensis.exe")) {
            throw "makensis.exe not found at $nsisPath after installing NSIS"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisPath

      # No Windows code-signing cert yet (see scripts/package/windows.sh's
      # header comment) — this builds unsigned automatically whenever
      # WINDOWS_CERTIFICATE_BASE64 isn't set, and switches to signed the
      # moment that secret is added, with no further changes needed here.
      - name: Decode signing certificate (if configured)
        id: decode-cert
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$WINDOWS_CERTIFICATE_BASE64" ]; then
            printf '%s' "$WINDOWS_CERTIFICATE_BASE64" | base64 --decode > "${RUNNER_TEMP}/certificate.pfx"
            echo "WINDOWS_SIGN_PFX_PATH=${RUNNER_TEMP}/certificate.pfx" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No WINDOWS_CERTIFICATE_BASE64 secret set — building unsigned."
            echo "UNSIGNED=1" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package Windows
        shell: bash
        env:
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: make package-windows VERSION="$VERSION"

      - name: Clean up certificate
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/certificate.pfx"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer
          path: dist/windows/*

  windows-artifact-validation:
    needs: [windows-package]
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    env:
      EXPECT_SIGNED: ${{ needs.windows-package.outputs.signed }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-installer
          path: dist/windows

      - name: Validate downloaded installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path dist/windows -Filter *.exe -File)
          if ($installers.Count -ne 1) {
            Write-Error "Expected exactly one Windows installer artifact, found $($installers.Count)."
            $installers | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            exit 1
          }

          $signature = Get-AuthenticodeSignature -FilePath $installers[0].FullName
          $signature | Format-List

          # windows-package only signs when WINDOWS_CERTIFICATE_BASE64 is
          # configured (see its "Decode signing certificate" step) — this
          # mirrors that same condition here instead of unconditionally
          # requiring a valid signature, so an expected-unsigned dry run
          # doesn't fail validation.
          if ($env:EXPECT_SIGNED -eq "true") {
            if ($signature.Status -ne "Valid") {
              Write-Error "Windows installer is not Authenticode signed with a valid signature."
              exit 1
            }
          } elseif ($signature.Status -ne "NotSigned") {
            Write-Error "Expected an unsigned installer (no WINDOWS_CERTIFICATE_BASE64 configured) but got signature status: $($signature.Status)."
            exit 1
          }

  ubuntu-package:
    needs: [test, determine-version]
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ubuntu'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.5"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"

      # Cached (keyed on the package list) since GitHub's default Azure apt
      # mirror has intermittent slow/degraded periods that otherwise turn
      # this install into a multi-minute stall.
      - name: Install Linux system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev
          version: 1.0

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build and package Ubuntu
        run: make package-ubuntu VERSION="$VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-deb
          path: dist/ubuntu/*

  ubuntu-artifact-validation:
    needs: [determine-version, ubuntu-package]
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ubuntu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ubuntu-deb
          path: dist/ubuntu

      - name: Validate downloaded deb
        env:
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          shopt -s nullglob
          debs=(dist/ubuntu/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "Expected exactly one Ubuntu deb artifact, found ${#debs[@]}." >&2
            printf 'Found: %s\n' "${debs[@]:-none}" >&2
            exit 1
          fi

          package_name="$(dpkg-deb --field "${debs[0]}" Package)"
          package_version="$(dpkg-deb --field "${debs[0]}" Version)"
          dpkg-deb --info "${debs[0]}"
          dpkg-deb --contents "${debs[0]}"
          # nfpm converts "-" to "~" in deb version strings (e.g.
          # 0.0.1-test -> 0.0.1~test) per Debian's own versioning convention
          # ("~" sorts before nothing, correct for a prerelease; "-" is
          # reserved as the upstream/debian-revision separator), so the
          # expected version needs the same translation before comparing.
          # The replacement side of ${var/pat/repl} undergoes tilde expansion
          # in bash 4+ (though not in macOS's ancient bash 3.2), so a bare
          # ~ here would expand to $HOME instead of staying literal — must
          # be escaped.
          expected_version="${VERSION//-/\~}"
          if [ "$package_version" != "$expected_version" ]; then
            echo "Package version ${package_version} does not match expected release version ${expected_version} (from ${VERSION})." >&2
            exit 1
          fi

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get install -y "./${debs[0]}"

          dpkg -s "$package_name"
          test -x /opt/winglet/Winglet
          test -e /usr/bin/winglet
          test -f /usr/share/applications/winglet.desktop

  checksums:
    needs: [determine-version, macos-artifact-validation, windows-artifact-validation, ubuntu-artifact-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-dmg
          path: dist/macos

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-installer
          path: dist/windows

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ubuntu-deb
          path: dist/ubuntu

      - name: Generate checksums and manifest
        run: ./scripts/package/checksums-and-manifest.sh "${{ needs.determine-version.outputs.version }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-manifest
          path: |
            dist/manifest.json
            dist/SHA256SUMS

  # Publishes a GitHub Release with every artifact attached. With public
  # releases, agentwinglet.com's download page can serve these assets directly
  # or mirror them elsewhere if needed.
  #
  # Skipped for a manual workflow_dispatch dry run (no tag to attach the
  # release to) — only a real tag push publishes.
  publish:
    needs: [determine-version, checksums]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist-artifacts/* \
            --title "Winglet v${VERSION}" \
            --generate-notes
